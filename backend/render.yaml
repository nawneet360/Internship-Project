services:
  - type: web
    name: disasterai-pro
    runtime: python
    region: oregon          # Options: oregon | frankfurt | singapore | ohio
    plan: free

    # ── Root of the backend inside your repository ───────────────────────────
    rootDir: backend

    # ── Build & Start ─────────────────────────────────────────────────────────
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    # ── Health check ──────────────────────────────────────────────────────────
    healthCheckPath: /api/health

    # ── Environment variables ─────────────────────────────────────────────────
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: TRAIN_SAMPLES
        value: "1500"
      - key: LOAD_SAVED_MODELS
        value: "true"
